<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banking app redesign · Case study · phunyisa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="../core/tokens-core.css">
<link rel="stylesheet" href="../themes/portfolio/theme.css">
<link rel="stylesheet" href="../core/motion.css">
<script>if(matchMedia('(prefers-reduced-motion: no-preference)').matches){document.documentElement.classList.add('m-on');setTimeout(function(){if(!window.__motion)document.documentElement.classList.remove('m-on')},2500)}</script>
<style>
/* tokens: ../core/tokens-core.css + ../themes/portfolio/theme.css (ห้ามใส่ค่าสีตรงนี้) */

:root[data-theme=dark]{color-scheme:dark;}
:root[data-theme=dark] .card.sm,:root[data-theme=dark] .step,:root[data-theme=dark] .case,:root[data-theme=dark] .formwrap,:root[data-theme=dark] .stats,:root[data-theme=dark] .foot{border-color:var(--elevation-border)}

*{box-sizing:border-box;margin:0}
html,body{overflow-x:clip}
body{background:var(--background);color:var(--ink);font:var(--body-md);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.nw{white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
/* nav — Apple global nav (core/components/navigation.md) */
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;font-size:20px;font-variation-settings:'FILL' 0,'wght' 400,'opsz' 20}
.gnav{position:sticky;top:0;z-index:20;height:var(--nav-h);background:var(--nav-bg);-webkit-backdrop-filter:blur(var(--nav-blur));backdrop-filter:blur(var(--nav-blur));border-bottom:1px solid var(--nav-border)}
@supports not (backdrop-filter:blur(1px)){.gnav{background:var(--background)}}
.gnav .in{max-width:1120px;margin:0 auto;height:100%;padding:0 var(--nav-pad-x);display:grid;grid-template-columns:1fr auto auto;column-gap:16px;align-items:center}
/* decisions #93: ชื่อซ้าย · 3 ลิงก์ชิดขวา · เส้นใต้แถบขึ้นเมื่อเลื่อนหน้าแล้วเท่านั้น */
.gnav{border-bottom-color:transparent;transition:border-color 160ms var(--ease-standard)}.gnav.is-scrolled{border-bottom-color:var(--nav-border)}
.logo{display:flex;align-items:center;gap:10px;font:var(--title-md);justify-self:start;border-radius:6px}
.dots{display:flex;gap:4px}.dots svg{display:block;height:20px;width:auto;overflow:visible}.dots i{width:8px;height:8px;border-radius:50%;display:block}
.gl{display:flex;gap:var(--nav-gap)}
.gl a{display:inline-flex;flex-direction:column;align-items:center;font:var(--nav-link-font);color:var(--nav-link);padding:8px 0;border-radius:6px;transition:color 120ms var(--ease-standard)}
.gl a::after{content:attr(data-label);font-weight:var(--nav-link-current-weight);height:0;visibility:hidden;overflow:hidden}
.gl a:hover,.gl a:active{color:var(--nav-link-hover)}
.gl a[aria-current]{color:var(--nav-link-current);font-weight:var(--nav-link-current-weight)}
.gnav a:focus-visible,.nib:focus-visible,.sheet a:focus-visible{outline:2px solid var(--focus-ring);outline-offset:4px}
.nr{justify-self:end;display:flex;gap:4px}
.nib{width:36px;height:36px;border-radius:999px;border:0;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.nib::before{content:"";position:absolute;inset:-4px}
.nib:hover{background:var(--btn-ghost-hover)}.nib:active{background:var(--btn-ghost-pressed)}
.nib.menu{display:none}
.scrim{position:fixed;inset:0;z-index:29;background:var(--nav-scrim);opacity:0;visibility:hidden;transition:opacity 240ms var(--ease-standard),visibility 0s 240ms}
.scrim.open{opacity:1;visibility:visible;transition:opacity 240ms var(--ease-standard)}
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:30;width:var(--nav-sheet-w);background:var(--nav-sheet-bg);border-left:1px solid var(--nav-sheet-border);box-shadow:var(--nav-sheet-shadow);padding:0 20px 24px;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform 300ms var(--ease-standard),visibility 0s 300ms}
.sheet.open{transform:none;visibility:visible;transition:transform 300ms var(--ease-emphasized)}
.sheet .sh-top{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;margin:0 -8px 8px 0}
.sheet a.sl{font:var(--nav-sheet-link);color:var(--text-2);min-height:var(--nav-sheet-row);display:flex;align-items:center;border-radius:var(--nav-sheet-item-radius);padding:0 var(--nav-sheet-item-pad);margin:0 calc(var(--nav-sheet-item-pad) * -1);transition:background-color 120ms,color 120ms}
.sheet a.sl:hover{background:var(--btn-ghost-hover);color:var(--ink)}
.sheet a.sl[aria-current]{color:var(--ink);background:var(--muted)}
.sheet .btn{margin-top:auto;justify-content:center;height:48px}
@media (max-width:719px){.gl{gap:20px}}
@media (max-width:479px){.gl{display:none}.nib.menu{display:inline-flex}.gnav .in{grid-template-columns:1fr auto}}
@media (min-width:480px){.sheet,.scrim{display:none}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.open{transition:opacity 100ms;transform:none}.sheet:not(.open){opacity:0}}
.btn{display:inline-flex;align-items:center;gap:8px;font:var(--label-lg);padding:9px 16px;border-radius:999px;border:1px solid transparent;cursor:pointer;transition:background .15s}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:var(--surface);border-color:var(--border-control);color:var(--ink)}.btn-outline:hover{background:var(--sidebar)}
.btn-white{background:var(--on-media);color:var(--primary)}
.btn-ghost-w{border-color:var(--btn-outline-white);color:var(--on-media)}
/* hero */
.hero{padding:80px 0 40px;position:relative}
.hero p.avail{font:var(--body-sm);color:var(--text-2);margin-top:14px}
.hero h1{font:var(--display-lg);letter-spacing:-0.02em;margin:16px 0 12px;max-width:640px}
.hero p{font:var(--body-lg);color:var(--text-2);max-width:560px}
.hero .cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;background:var(--surface);border:1px solid var(--border);border-radius:20px}
.stats div{padding:20px 24px}.stats div+div{border-left:1px solid var(--border)}
.stats b{display:block;font:var(--headline-lg);letter-spacing:-0.01em}
.stats span{font:var(--body-sm);color:var(--text-2)}
/* sections */
section{padding:var(--section-gap) 0 0}  /* ระยะระหว่าง section 72 · มือถือ 56 (token) */
.sh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:16px}  /* หัวส่วน → เนื้อหา 20 ทุกส่วน */
.eyebrow{font:var(--label-md);color:var(--link);letter-spacing:.02em;margin-bottom:8px;display:block}
h2{font:var(--headline-lg);letter-spacing:-0.01em}
.link{font:var(--label-lg);color:var(--link)}
/* work grid */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.card{border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s}
.card{box-shadow:var(--elevation-1);transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:var(--elevation-2)}
.card.big.a,.card.big.b{box-shadow:none}
.card.big{grid-column:span 3;min-height:360px;color:var(--on-media);padding:28px;justify-content:space-between}
.card.big.a{background:var(--primary);position:relative}
.card.big.b{background:var(--muted)}
.card.big.soft{background:var(--muted);color:var(--ink);border:1px solid var(--border)}
.card.big.soft .cat{color:var(--text-2);opacity:1}
.card.big.soft p{color:var(--text-2);opacity:1}

.card.sm{grid-column:span 2;background:var(--surface);border:1px solid var(--border)}
.card .cat{align-self:flex-start;font:var(--body-sm);opacity:.85}
.card.big h3{font:var(--headline-sm);margin-top:auto}
.card.big p{font:var(--body-sm);opacity:.85;margin-top:4px}
.mock{display:flex;justify-content:center;align-items:center;margin:20px 0}
.ph-fig{display:flex;align-items:center;justify-content:center;text-align:center;font:var(--label-md);border:1px dashed var(--ph-border);border-radius:12px;color:var(--text-2);background:var(--ph-bg);padding:8px}
.card.big.a .ph-fig{border-color:var(--on-media-border);color:var(--on-media-muted);background:var(--on-media-fill)}
.tbd{color:var(--text-2)}.tbd-tag{font-style:normal;font:var(--label-md);padding:1px 6px;border-radius:var(--radius-xs);background:transparent;border:1px dashed var(--border-control);color:var(--text-2)}
.stats b,.case .meta b{font-variant-numeric:tabular-nums}

.cover{aspect-ratio:16/10;background:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md)}

/* Project card v1.2 — card.md · chip.md */
.card.sm{padding:10px;position:relative}
.card.sm .body{padding:12px 4px 4px;display:flex;flex-direction:column}
.stl{font:500 12px/1.5 var(--font-sans);color:var(--text-2)}.stl.prog{color:var(--status-fg-progress)}
.card.sm h3{font:var(--title-md);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.sm .body>h3:first-child{margin-top:0}
.card.sm h3 a::after{content:"";position:absolute;inset:0;border-radius:20px}
.card.sm h3 a:focus-visible{outline:none}
.card.sm:has(h3 a:focus-visible){box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--input-ring)}
.card.sm .desc{font:var(--body-sm);color:var(--text-2);margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative;z-index:1}
.tg{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--tag-bg);color:var(--tag-fg);font:400 12px/1 var(--font-sans);white-space:nowrap;transition:background-color .1s,color .1s}
.tg:hover{background:var(--tag-bg-hover);color:var(--ink)}.tg:active{background:var(--tag-bg-pressed)}
.tg:focus-visible{outline:2px solid var(--input-ring);outline-offset:2px}
.card.sm .meta{font:400 12px/1.5 var(--font-sans);color:var(--text-2);margin-top:8px;font-variant-numeric:tabular-nums}
/* process */
.proc{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:var(--elevation-1)}
.step .n{font:500 32px/1 var(--font-sans);color:var(--link);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:16px}
.step h3{font:var(--title-lg);margin-bottom:6px}
.step p{font:var(--body-sm);color:var(--text-2)}
/* case study excerpt */
.case{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:40px}
.case .meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.case .meta div{border-top:1px solid var(--border);padding:12px 0 0}
.case .meta small{font:var(--label-md);color:var(--text-2);display:block}
.case .meta b{font:var(--title-md)}
.case h3{font:var(--headline-sm);margin-bottom:12px}
.case p{font:var(--body-md);color:var(--text-2);max-width:62ch}
.case p+p{margin-top:16px}
.quote{margin-top:var(--space-6);padding:var(--space-5) var(--space-6);border-radius:var(--radius-md);background:var(--muted);font:var(--body-lg);color:var(--ink)}
.quote small{display:block;font:var(--body-sm);color:var(--text-2);margin-top:8px}

/* form */
.formwrap{display:grid;grid-template-columns:1fr 1.3fr;gap:40px;background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:40px}
.formwrap h2{margin-bottom:10px}.formwrap>div>p{font:var(--body-md);color:var(--text-2)}
.states{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;font:var(--body-sm)}
.alert b{font:var(--label-lg);display:block}
.alert svg{flex:none;margin-top:2px}
.alert.ok{background:var(--success-tint);color:var(--success-tint-foreground)}.alert.wa{background:var(--warning-tint);color:var(--warning-tint-foreground)}.alert.er{background:var(--danger-tint);color:var(--danger-tint-foreground)}
.field{margin-bottom:16px}
.field label{font:var(--label-lg);display:block;margin-bottom:6px}
.field input,.field textarea{width:100%;font:var(--body-md);color:var(--ink);background:var(--input-bg);border:0;border-radius:12px;padding:0 16px;height:44px;outline:none;transition:background-color 160ms cubic-bezier(.2,0,0,1),box-shadow 160ms}
.field input:hover,.field textarea:hover{background:var(--input-bg-hover)}
.field textarea{padding:10px 16px;height:auto}
.field textarea{min-height:96px;max-height:480px;resize:vertical;line-height:1.6;overflow:auto}
.field input::placeholder,.field textarea::placeholder{color:var(--text-2)}
.field input:focus,.field textarea:focus{background:var(--surface);box-shadow:0 0 0 2px var(--input-ring)}
.field.err input{background:var(--danger-tint);box-shadow:inset 0 0 0 1px var(--danger-strong)}
.field .hint{font:var(--body-sm);color:var(--text-2);margin-top:6px}
.field.err .hint{color:var(--danger-strong)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn-danger{background:var(--surface);border-color:var(--border-control);color:var(--danger-strong)}
@media (max-width:900px){.formwrap{grid-template-columns:1fr;padding:28px}}
@media (max-width:599px){.row2{grid-template-columns:1fr}}
/* footer */
.foot{margin:72px 0 32px;border-radius:28px;background:var(--surface);border:1px solid var(--border);color:var(--ink);padding:44px 56px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.foot h2{font:var(--headline-lg);max-width:520px}
.copy{display:flex;justify-content:space-between;font:var(--body-sm);color:var(--text-3);padding-bottom:40px}
@media (max-width:900px){
  .hero{padding:48px 0 28px}
  .grid{grid-template-columns:1fr 1fr}.card.big{grid-column:span 2;min-height:360px}.card.sm{grid-column:span 1}
  .proc{grid-template-columns:1fr 1fr}
  .case{grid-template-columns:1fr;padding:28px;gap:24px}
  .foot{padding:40px 28px}
}
@media (max-width:599px){
  .wrap{padding:0 16px}
  .stats{grid-template-columns:1fr}.stats div+div{border-left:none;border-top:1px solid var(--border)}
  .grid,.proc{grid-template-columns:1fr}.card.big,.card.sm{grid-column:span 1}
  section{padding-top:var(--section-gap)}
  .sh{flex-direction:column;align-items:flex-start}
}

/* Hero แบบ A: Sand Studio + หัวโปรไฟล์เล็กแบบ Spotify + ปุ่ม (decisions #62) */
.hero{padding:56px 0 8px}
.hero .cta .btn{height:40px;padding:0 18px;margin:0}
.hero-id{display:flex;align-items:center;gap:10px;font:var(--body-md);color:var(--text-2);margin:0}
.hero-id b{font-weight:500;color:var(--ink)}
.hero-av{width:var(--avatar-40);height:var(--avatar-40);border-radius:50%;background:var(--avatar-bg);color:var(--avatar-fg);display:grid;place-items:center;font:500 16px/1 var(--font-sans);flex:none;margin-right:2px}
.hero h1{font:var(--display-xl);letter-spacing:-0.02em;margin:20px 0 0;max-width:820px;text-wrap:balance;overflow-wrap:anywhere}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px 40px;margin-top:40px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap}
.hero-meta{display:grid;grid-template-columns:repeat(3,auto);gap:12px 48px;margin:0}
.hero-meta dt{font:var(--body-sm);color:var(--text-2)}.hero-meta dd{font:var(--body-md);color:var(--ink);margin:2px 0 0;white-space:nowrap}
.hero .cta{margin:0;gap:8px}
@media (max-width:600px){
  .hero{padding:32px 0 4px}.hero h1{margin-top:16px}
  .hero .cta .btn{height:44px}
  .hero-row{margin-top:28px;flex-direction:column;align-items:stretch}
  .hero-meta{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}.hero-meta>div:first-child{grid-column:1/-1}.hero-meta dd{white-space:normal}
  .hero .cta .btn{flex:1;justify-content:center}
}

/* ส่วนผลงาน: กริดแบบ Instagram (ชื่อใต้ภาพ) + รายการ · ค้นหา / กรอง / เรียง / สลับมุมมอง (decisions #63) */
.wk [hidden]{display:none!important}.cp [hidden]{display:none!important}
.wk .ms{display:inline-block;width:1em;height:1em;overflow:hidden;white-space:nowrap;flex:none}
.wk-head{display:flex;align-items:baseline;gap:10px;margin-bottom:20px}.wk-head h2{margin:0}
.wk-n{font:var(--body-sm);color:var(--text-2);font-variant-numeric:tabular-nums}
.wk-bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px 16px;margin-bottom:20px}
.wk-catw{display:flex;align-items:center;gap:4px;min-width:0}
.wk-cats{flex:0 1 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 2px;margin:-6px -2px;min-width:0}
.wk-cats::-webkit-scrollbar{display:none}
.wk-fc{flex:none;display:inline-flex;align-items:center;gap:6px;height:var(--chip-h);padding:0 var(--chip-px);border:0;border-radius:var(--radius-full);background:transparent;color:var(--chip-fg);font:500 13px/1 var(--font-sans);white-space:nowrap;cursor:pointer;transition:background-color 100ms,color 100ms}
.wk-fc:hover{background:var(--chip-bg-hover);color:var(--chip-fg-hover)}.wk-fc:active{background:var(--chip-bg-pressed)}
.wk-fc:focus-visible{outline:2px solid var(--input-ring);outline-offset:2px}
.wk-fc[aria-pressed=true]{background:var(--chip-on-bg);color:var(--chip-on-fg)}.wk-fc[aria-pressed=true]:hover{background:var(--chip-on-bg-hover)}
.wk-fc i{font-style:normal;font-weight:400;opacity:.7;font-variant-numeric:tabular-nums}
.wk-tools{display:flex;align-items:center;gap:8px}
.wk-search{display:flex;align-items:center;gap:6px;height:36px;width:220px;padding:0 6px 0 12px;border-radius:var(--radius-full);background:var(--input-bg);transition:background-color 160ms,box-shadow 160ms;cursor:text}
.wk-search:hover{background:var(--input-bg-hover)}
.wk-search:focus-within{background:var(--input-bg-focus);box-shadow:0 0 0 2px var(--input-ring)}
.wk-search>.ms{font-size:18px;color:var(--text-2)}
.wk-search input{flex:1;min-width:0;width:100%;border:0;background:none;outline:none;font:400 14px/1 var(--font-sans);color:var(--input-fg)}
.wk-search input::placeholder{color:var(--input-placeholder)}.wk-search input::-webkit-search-cancel-button{display:none}
.wk-clr{width:24px;height:24px;border:0;border-radius:50%;background:none;color:var(--text-2);display:grid;place-items:center;cursor:pointer}.wk-clr .ms{font-size:16px}
.wk-clr:hover{background:var(--muted-hover);color:var(--ink)}.wk-clr:focus-visible{outline:2px solid var(--input-ring)}
.wk-dd{position:relative}
.wk-sortb{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px 0 14px;border:0;border-radius:var(--radius-full);background:none;color:var(--text-2);font:400 14px/1 var(--font-sans);cursor:pointer;white-space:nowrap}
.wk-sortb b{font-weight:500;color:var(--ink)}.wk-sortb .ms{font-size:18px}
.wk-sortb:hover{background:var(--muted)}.wk-sortb:focus-visible{outline:2px solid var(--input-ring);outline-offset:2px}
.wk-mn{position:absolute;right:0;top:calc(100% + var(--menu-offset));z-index:20;min-width:180px;background:var(--menu-bg);border-radius:var(--menu-radius);padding:var(--menu-pad);box-shadow:var(--menu-shadow);opacity:0;visibility:hidden;transform:translateY(-4px) scale(.98);transform-origin:top right;transition:opacity 120ms,transform 160ms var(--ease-standard),visibility 0s 160ms}
.wk-mn.open{opacity:1;visibility:visible;transform:none;transition:opacity 120ms,transform 160ms var(--ease-standard)}
.wk-mi{display:flex;align-items:center;gap:var(--menu-item-gap);width:100%;height:var(--menu-item-h);padding:var(--menu-item-pad);border:0;border-radius:var(--menu-item-radius);background:none;font:var(--menu-item-font);color:var(--menu-item-fg);cursor:pointer;text-align:left}

/* Case study บนหน้าแรก: Sand Studio + Apple (decisions #74) · ภาพก่อน/หลัง */

/* หน้า case study เต็ม: หัวแบบ Spotify + สารบัญเหมือนรายการเพลง (decisions #74) */

/* case study v1.1: แท็ก · แถวข้อมูล · บล็อกเลือกใส่ได้ (decisions #76) */
.cp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cp-tags a{display:inline-flex;align-items:center;height:var(--tag-h);padding:0 var(--tag-px);border-radius:var(--radius-full);background:var(--tag-bg);color:var(--tag-fg);font:400 12px/1 var(--font-sans);text-decoration:none;transition:background-color .1s,color .1s}

.cp-scope{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.cp-scope>span{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--radius-full);border:1px solid var(--border-control);font:400 12px/1 var(--font-sans);color:var(--ink)}

.cp-tr{grid-template-columns:20px minmax(0,1fr)!important}

.cp-fig{margin:20px 0}.cp-fig>img,.cp-fig>.cp-zoom,.cp-fig>.cp-imgl{display:block;width:100%;height:auto;border-radius:var(--radius-lg);overflow:hidden}.cp-zoom img,.cp-imgl img{display:block;width:100%;height:auto}.cp-imgl:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.cp-h{font:var(--title-lg);color:var(--ink);margin:28px 0 8px}.cp-ch h2+.cp-h{margin-top:0}.cp-hr{border:0;border-top:1px solid var(--border);margin:32px 0}

.cp-gal{display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr));gap:12px;align-items:start}

.cp-vid{margin:20px 0}
